# pnpm workspace root.
#
# Only publishable packages are members of this workspace. The dashboard in
# web/ intentionally stays OUT of the workspace: it keeps its own
# web/pnpm-lock.yaml and is built standalone by .github/workflows/ci.yml
# (cache-dependency-path: web/pnpm-lock.yaml). Do not add web/ here without
# also reworking that CI job.
packages:
  - "packages/*"

# Skip pnpm's pre-run dependency verification (mirrors web/ and octarq-pro).
verifyDepsBeforeRun: false
# pnpm 10+ treats an ignored build script as the fatal ERR_PNPM_IGNORED_BUILDS
# rather than a warning, so esbuild's postinstall must be explicitly approved.
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: true
