version: '3.8'

services:
  octarq:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "${OCTARQ_PORT:-8080}:8080"
    environment:
      OCTARQ_SECRET_KEY: ${OCTARQ_SECRET_KEY:-super-secret-key-16-bytes}
      OCTARQ_ADMIN_PASSWORD: ${OCTARQ_ADMIN_PASSWORD:-admin123456}
      OCTARQ_ADMIN_USER: ${OCTARQ_ADMIN_USER:-admin}
      OCTARQ_DB_DRIVER: sqlite
      OCTARQ_DB_DSN: /data/octarq.db
      # OpenTelemetry configuration
      OCTARQ_OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: "octarq"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "prometheus"
    volumes:
      - octarq-data:/data
    depends_on:
      - otel-collector
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "8889:8889" # Prometheus metrics exporter
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686" # Jaeger UI
      - "14268:14268" # Jaeger HTTP intake

  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090" # Prometheus UI & API

volumes:
  octarq-data:
