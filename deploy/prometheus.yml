global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Scrape octarq directly via /metrics endpoint
  - job_name: 'octarq'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['octarq:8080']

  # Scrape OTel collector metrics exporter
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
