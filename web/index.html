<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Console</title>
    <!-- SVG only: every browser this dashboard targets supports it, and there is
         no .ico in web/public to fall back to — linking one would just 404. An
         operator running white-label replaces this at runtime from brand.tsx,
         so it's the Octarq default rather than a hardcode. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Theme: default is LIGHT (Wise/Cloudflare idiom). Apply the persisted
         choice synchronously, before first paint, so there is no flash of the
         wrong theme. The toggle in the TopBar writes `octarq-theme`. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("octarq-theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
    <!-- Fonts via <link> + preconnect rather than a CSS @import so they don't
         block the stylesheet from parsing; display=swap avoids FOIT. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
