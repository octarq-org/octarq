name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create GitHub release + upload assets + commit CHANGELOG.md
  packages: write   # push to GHCR

env:
  IMAGE: ghcr.io/octarq-org/octarq

jobs:
  # ── goreleaser: binaries + GitHub release + GHCR images ──────────────────
  # One run cross-compiles linux/{amd64,arm64} natively, attaches binaries +
  # checksums to the GitHub release, and pushes multi-arch images assembled
  # from those SAME binaries via Dockerfile.release — Go compiles once per
  # arch instead of again inside every per-arch Docker build.
  #
  # Release notes stay git-cliff-generated with the exact flags the old
  # softprops flow used (--latest --strip header). The notes file lives in
  # $RUNNER_TEMP, outside the worktree, so goreleaser's dirty-tree check
  # never sees it.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # goreleaser + git-cliff need full history and tags

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes (git-cliff)
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: ${{ runner.temp }}/release-notes.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Regenerate CHANGELOG.md and commit it back to main ───────────────────
  changelog:
    name: Commit CHANGELOG.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate full CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit CHANGELOG.md back to main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(release): update CHANGELOG for ${{ github.ref_name }}"
          file_pattern: CHANGELOG.md
          branch: main
