name: Publish SDK

# Publishes @octarq/plugin-sdk.
#
# Two paths:
#   1. push to main  -> changesets flow. If unconsumed changesets exist, the
#      changesets action opens/updates a "Version Packages" PR. When that PR is
#      merged (a subsequent push to main with the version bump committed and the
#      changeset files removed), the same action runs `pnpm changeset publish`
#      and pushes the package. This is self-guarding: with no changesets there
#      is nothing to version, and after publishing the changesets are gone, so
#      it cannot loop.
#   2. push of an `sdk-v*` tag -> direct one-shot publish of the current SDK
#      version (escape hatch / manual release).

# Enabled for the first release: on push to main the changesets action opens a
# "Version Packages" PR when unconsumed changesets exist, and publishes once that
# PR is merged. Also runnable via manual dispatch and sdk-v* tags.
#
# Publishing authenticates with npm trusted publishing (OIDC), not a token.
# The package's Trusted Publisher on npmjs.com names this workflow file; the
# job's `id-token: write` permission is what mints the credential. Never add an
# NPM_TOKEN back: npm returns 404 for a token that may not publish, and npm is
# dropping token publishing in 2027.
#
# Prerequisite: the Trusted Publisher entry for @octarq/plugin-sdk must list
# `octarq-org/octarq` and `publish-sdk.yml`, with the `npm publish` action
# allowed. A new entry expires if it does not publish within two days.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".changeset/**"
      - ".github/workflows/publish-sdk.yml"
    tags: ["sdk-v*"]

# Top-level: least privilege. The changesets job widens this locally.
permissions:
  contents: read

concurrency:
  group: publish-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Changesets-driven release on main ────────────────────────────────────
  release:
    name: Version or publish (changesets)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # commit version bumps / push tags
      pull-requests: write   # open the "Version Packages" PR
      id-token: write        # trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_GITHUB || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0 # keep in sync with root package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @octarq/plugin-sdk build

      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB || secrets.GITHUB_TOKEN }}

  # ── One-shot publish on an sdk-v* tag ────────────────────────────────────
  tag-publish:
    name: Publish on sdk-v* tag
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @octarq/plugin-sdk build

      - name: Publish
        run: pnpm publish --filter @octarq/plugin-sdk --no-git-checks
