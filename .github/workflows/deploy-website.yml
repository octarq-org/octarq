name: Deploy website

# The Astro site in website/ (landing page + docs). It is a standalone pnpm
# project — its own lockfile, deliberately outside the root pnpm-workspace.yaml
# and outside web/'s workspace — so this job installs from website/ alone and
# never sees the dashboard's dependency tree.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: deploy-website-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4 # same pin as ci.yml; pnpm 10+ breaks on esbuild's build script

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      # Prebuild automatically generates public/openapi.json from the Go handlers
      # of the current release tag / commit before invoking astro build.
      - name: Build
        run: pnpm build

      # Regression guard for the /api-reference/ interactive explorer: the
      # built page must contain the Scalar mount point and must not load any
      # third-party scripts. Reads dist/ output, not the source.
      - name: Check API reference build
        run: node scripts/check-api-reference.mjs

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist/
          retention-days: 1

  # Preview deploys run on pull requests to provide a temporary preview URL
  # without triggering a production deployment event in GitHub UI.
  preview:
    name: Deploy preview
    needs: [build]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: preview
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: website/dist

      - name: Check Cloudflare credentials
        id: check_creds
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::notice::CLOUDFLARE_API_TOKEN is not configured in the 'preview' environment or repository secrets. Skipping preview deployment."
          fi

      - name: Deploy to Cloudflare Preview
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          packageManager: pnpm
          command: deploy --env preview

  # Production deploys run ONLY on merge to main, release tags (v*), or manual dispatch.
  # This isolates the production environment registration to actual production releases.
  production:
    name: Deploy production
    needs: [build]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://docs.octarq.org
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: website/dist

      - name: Deploy to Cloudflare Production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          packageManager: pnpm
          command: deploy
