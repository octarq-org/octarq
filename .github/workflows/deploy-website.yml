name: Deploy website

# The Astro site in website/ (landing page + docs). It is a standalone pnpm
# project — its own lockfile, deliberately outside the root pnpm-workspace.yaml
# and outside web/'s workspace — so this job installs from website/ alone and
# never sees the dashboard's dependency tree.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: deploy-website-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4 # same pin as ci.yml; pnpm 10+ breaks on esbuild's build script

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      # Prebuild automatically generates public/openapi.json from the Go handlers
      # of the current release tag / commit before invoking astro build.
      - name: Build
        run: pnpm build

      # Regression guard for the /api-reference/ interactive explorer: the
      # built page must contain the Scalar mount point and must not load any
      # third-party scripts. Reads dist/ output, not the source.
      - name: Check API reference build
        run: node scripts/check-api-reference.mjs

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist/
          retention-days: 1

  # Preview deploys run on pull requests to provide a temporary preview URL
  # without triggering a production deployment event in GitHub UI.
  # Uses `wrangler versions upload --preview-alias pr-N` against the same
  # `octarq-docs` worker (no separate preview worker name).
  # The preview URL is parsed directly from wrangler's stdout output.
  preview:
    name: Deploy preview
    needs: [build]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: preview
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: website/dist

      - name: Check Cloudflare credentials
        id: check_creds
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::notice::CLOUDFLARE_API_TOKEN is not configured in the 'preview' environment. Skipping preview deployment."
          fi

      - name: Upload version to Cloudflare (preview)
        id: upload_preview
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          packageManager: pnpm
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }} --message "PR #${{ github.event.pull_request.number }} — ${{ github.sha }}"

      - name: Comment preview URL
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: actions/github-script@v7
        env:
          CMD_OUTPUT: ${{ steps.upload_preview.outputs.command-output }}
          DEPLOYMENT_URL: ${{ steps.upload_preview.outputs.deployment-url }}
        with:
          script: |
            const output = process.env.CMD_OUTPUT || '';
            const match = output.match(/https:\/\/[^\s]+\.workers\.dev[^\s]*/);
            const previewUrl = match ? match[0] : (process.env.DEPLOYMENT_URL || '');
            if (!previewUrl) {
              console.log('No preview URL found in wrangler output');
              return;
            }
            const body = `🚀 Preview deployed to ${previewUrl}\n\nCommit ${context.sha.slice(0, 7)} — [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            // Upsert: update existing bot comment or create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('Preview deployed to'));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # When a PR branch is deleted, no action needed: Cloudflare Workers
  # version lifecycle and aliases are automatically managed / rotated by Cloudflare.

  # Production deploys run ONLY on merge to main, release tags (v*), or manual dispatch.
  # This isolates the production environment registration to actual production releases.
  production:
    name: Deploy production
    needs: [build]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://docs.octarq.org
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: website/dist

      - name: Deploy to Cloudflare Production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          packageManager: pnpm
          command: deploy

      - name: Cleanup old Cloudflare deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: octarq-docs
        run: |
          set -euo pipefail

          API="https://api.cloudflare.com/client/v4"
          ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:-}"
          if [ -z "$ACCOUNT_ID" ]; then
            ACCOUNT_ID=$(curl -sSL -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/accounts" | jq -r '.result[0].id // empty')
          fi
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::warning::Unable to determine Cloudflare Account ID. Skipping old deployments cleanup."
            exit 0
          fi

          BASE="$API/accounts/$ACCOUNT_ID/workers/scripts/$WORKER_NAME/deployments"

          echo "Fetching deployments for $WORKER_NAME (account: $ACCOUNT_ID)..."

          res=$(curl -sSL \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "$BASE")

          # Cloudflare returns the active deployment as the first entry (index 0).
          # Retain the active deployment and delete older inactive deployments.
          deployment_ids=$(echo "$res" | jq -r '
            (.result.deployments // .result // [])[1:][]?.id // empty
          ')

          if [ -z "$deployment_ids" ]; then
            echo "No old deployments to delete."
          else
            for deployment_id in $deployment_ids; do
              echo "Deleting old deployment: $deployment_id"
              curl -sSL \
                -X DELETE \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                "$BASE/$deployment_id" | jq -c . || echo "Failed to delete $deployment_id, continuing..."
              echo
            done
          fi

          echo "Cleanup completed."

