name: Deploy website

# The Astro site in website/ (landing page + docs). It is a standalone pnpm
# project — its own lockfile, deliberately outside the root pnpm-workspace.yaml
# and outside web/'s workspace — so this job installs from website/ alone and
# never sees the dashboard's dependency tree.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read

# Deploys are not interchangeable: never cancel an in-flight main/tag deploy, or the
# live site can be left mid-upload. PR builds are only a check, so they cancel.
concurrency:
  group: deploy-website-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    name: Build & deploy
    runs-on: ubuntu-latest
    # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are environment secrets, not
    # repository secrets, so a job that doesn't name the environment cannot see
    # them — secrets.X is simply empty and wrangler fails at the deploy step with
    # "necessary to set a CLOUDFLARE_API_TOKEN". That is what broke every deploy
    # from 2026-08-06 on, silently: PR runs stop before the deploy step and stay
    # green, so only main went red and the live site quietly froze.
    environment:
      name: production
      url: https://docs.octarq.org
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4 # same pin as ci.yml; pnpm 10+ breaks on esbuild's build script

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      # Prebuild automatically generates public/openapi.json from the Go handlers
      # of the current release tag / commit before invoking astro build.
      - name: Build
        run: pnpm build

      # Regression guard for the /api-reference/ interactive explorer: the
      # built page must contain the Scalar mount point and must not load any
      # third-party scripts. Reads dist/ output, not the source.
      - name: Check API reference build
        run: node scripts/check-api-reference.mjs

      # Production deploys are triggered exclusively on release tags (v*) or
      # manual workflow_dispatch. Pushes to main and PRs run type-check, build,
      # and check-api-reference to verify the site builds without publishing.
      - name: Deploy to Cloudflare
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          # wrangler.jsonc points `assets` at ./dist — the build above.
          command: deploy
