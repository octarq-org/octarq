name: Deploy website

# The Astro site in website/ (landing page + docs). It is a standalone pnpm
# project — its own lockfile, deliberately outside the root pnpm-workspace.yaml
# and outside web/'s workspace — so this job installs from website/ alone and
# never sees the dashboard's dependency tree.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read

# Deploys are not interchangeable: never cancel an in-flight main deploy, or the
# live site can be left mid-upload. PR builds are only a check, so they cancel.
concurrency:
  group: deploy-website-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build & deploy
    runs-on: ubuntu-latest
    # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are environment secrets, not
    # repository secrets, so a job that doesn't name the environment cannot see
    # them — secrets.X is simply empty and wrangler fails at the deploy step with
    # "necessary to set a CLOUDFLARE_API_TOKEN". That is what broke every deploy
    # from 2026-08-06 on, silently: PR runs stop before the deploy step and stay
    # green, so only main went red and the live site quietly froze.
    environment: production
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4 # same pin as ci.yml; pnpm 10+ breaks on esbuild's build script

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # `pnpm lint:docs` is deliberately NOT run here. The nimbus-docs CLI the
      # lockfile installs only walks `.mdx`, and every page under
      # src/content/docs is `.md`, so on a clean checkout it exits 1 with "No
      # .mdx files found" without having linted anything. A working copy whose
      # node_modules predates the lockfile has a different 0.8.2 build that does
      # walk `.md` — which is why it passes locally and cannot pass here.
      #
      # Adding it back means either moving the content to `.mdx` or pinning a
      # CLI that reads `.md`. Until one of those happens, a step that always
      # fails is worse than no step, and a step made to pass with
      # `|| true` is worse than both.

      # Only main publishes. A PR run stops after the build above, which is the
      # part that can actually be wrong.
      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          # wrangler.jsonc points `assets` at ./dist — the build above.
          command: deploy
