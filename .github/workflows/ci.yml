name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  go:
    name: Go test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -count=1 ./...

      # v6 of the action installs golangci-lint v1, which cannot read this
      # repo's `version: "2"` config and refuses outright to lint a module
      # targeting a newer Go than it was built with ("the Go language version
      # (go1.24) used to build golangci-lint is lower than the targeted Go
      # version (1.25.11)"). Locally the v2 binary was already on PATH, so this
      # step passed everywhere except CI, which is where it had never run.
      #
      # `version` is pinned rather than `latest`: the failure mode above is a
      # linter release drifting out of step with the toolchain, and that is not
      # something an unrelated PR should discover.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4 # keep at or above the Go version in go.mod

  web:
    name: Frontend build
    runs-on: ubuntu-latest
    permissions:
      contents: write # auto-commit webembed/dist on main
    defaults:
      run:
        working-directory: web
    steps:
      # On a pull_request the default checkout is a detached merge commit, which
      # the dist auto-commit below has no branch to push back to. Check out the
      # PR's own branch instead; on push events head_ref is empty and this falls
      # back to the pushed ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4 # keep in sync with web/package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Not --frozen: web/package.json lists @octarq-org/plugin-issuer as an
      # OPTIONAL dep (a private GitHub Packages tarball this public build has no
      # token for). pnpm excludes it gracefully, but its resolution can't be
      # pinned into the committed lockfile without auth, so a frozen install
      # would fail on the mismatch. The OSS build never composes it anyway — its
      # manifest (web/octarq.plugins.json) ships only the example plugin.
      - run: pnpm install --no-frozen-lockfile

      # Advisory only: surfaces known CVEs in frontend deps without gating the
      # build (a fresh upstream advisory shouldn't block an unrelated merge).
      - name: Audit dependencies
        run: pnpm audit --prod || true

      - name: Type-check
        run: pnpm typecheck

      - name: Color lint
        run: pnpm lint:colors

      # Gates three classes that typecheck can't see, because every one of them
      # is a valid string: a locale missing keys the others have, user-visible
      # English hardcoded into JSX, and a t() key that resolves to nothing (which
      # renders the key itself on screen). octarq-pro isn't checked out here, so
      # the audit's Pro half is skipped — it runs locally where both repos sit
      # side by side.
      - name: i18n audit
        run: pnpm i18n:audit

      - name: Test dashboard
        run: pnpm test

      # plugin-sdk is a member of the web workspace (../packages/*), so its
      # deps are already installed by the pnpm install above.
      - name: Test plugin SDK
        run: pnpm --filter @octarq/plugin-sdk test

      - name: Build dashboard
        run: pnpm build

      # webembed/dist must stay committed: octarq-pro consumes octarq as a Go module
      # and gets the embedded dashboard from the module zip. CI keeps it fresh so
      # nobody has to build and commit dist locally.
      #
      # This refreshes it on the PR branch, not on main. The original reason was
      # that main was protected and required status checks a bare push cannot
      # have, so every such push was rejected with GH006 and main's CI went red
      # on every merge from 2026-07-28 on — and worse than the red X, dist
      # silently stopped being refreshed, so octarq-pro shipped a dashboard two
      # days older than main.
      #
      # That protection has since been removed (as of 2026-07-29 main has no
      # branch protection rule and no ruleset), so the GH006 rejection no longer
      # applies. Keep doing it on the branch anyway: the merge then carries a
      # current dist through the normal PR path, with nothing bypassing review,
      # and it does not depend on main's protection settings either way.
      #
      # Commits made with GITHUB_TOKEN don't retrigger workflows, so this can't
      # loop, and the check that already passed stays passed.
      - name: Commit refreshed webembed/dist (PR branches)
        if: github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(web): refresh embedded dashboard build [auto]"
          file_pattern: webembed/dist
