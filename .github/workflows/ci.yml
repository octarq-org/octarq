name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'

  go:
    name: Go test & lint
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # One run: race detector + coverage profile. A second `go test` for the
      # ratchet used to add ~40s on top of the ~4 min race suite.
      #
      # The excludes are generated or embedded-artifact packages, which have no
      # meaningful statements to cover and would only drag the total down. Their
      # tests still run; only the threshold accounting drops them.
      # A ratchet, not an aspiration: the number is the floor the suite already
      # clears, so the only way it goes red is a change that tests less than the
      # code it replaces. Raise it when coverage rises; never lower it to make a
      # branch pass.
      - name: go test (race + coverage)
        run: |
          THRESHOLD=90
          EXCL='/(webembed|openapi|cmd/octarq-build|cmd/openapi-gen|examples)/'
          go test -race -count=1 -coverprofile=coverage.all.out ./...
          awk -v excl="$EXCL" 'NR==1 || $0 !~ excl' coverage.all.out > coverage.out
          total=$(go tool cover -func=coverage.out | awk '/total:/ {print $3}' | tr -d '%')
          echo "Total test coverage: ${total}% (threshold: ${THRESHOLD}%)"
          is_below=$(awk -v tot="$total" -v thresh="$THRESHOLD" 'BEGIN { print (tot < thresh) ? 1 : 0 }')
          if [ "$is_below" -eq 1 ]; then
            echo "Coverage ${total}% is below required threshold ${THRESHOLD}%!"
            exit 1
          fi

      # v6 of the action installs golangci-lint v1, which cannot read this
      # repo's `version: "2"` config and refuses outright to lint a module
      # targeting a newer Go than it was built with ("the Go language version
      # (go1.24) used to build golangci-lint is lower than the targeted Go
      # version (1.25.11)"). Locally the v2 binary was already on PATH, so this
      # step passed everywhere except CI, which is where it had never run.
      #
      # `version` is pinned rather than `latest`: the failure mode above is a
      # linter release drifting out of step with the toolchain, and that is not
      # something an unrelated PR should discover.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4 # keep at or above the Go version in go.mod
          verify: false

  web:
    name: Frontend build
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4 # keep in sync with web/package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Not --frozen: web/package.json lists @octarq-org/plugin-issuer as an
      # OPTIONAL dep (a private GitHub Packages tarball this public build has no
      # token for). pnpm excludes it gracefully, but its resolution can't be
      # pinned into the committed lockfile without auth, so a frozen install
      # would fail on the mismatch. The OSS build never composes it anyway — its
      # manifest (web/octarq.plugins.json) ships only the example plugin.
      - run: pnpm install --no-frozen-lockfile

      # Advisory only: surfaces known CVEs in frontend deps without gating the
      # build (a fresh upstream advisory shouldn't block an unrelated merge).
      - name: Audit dependencies
        run: pnpm audit --prod || true

      - name: Type-check
        run: pnpm typecheck

      - name: Color lint
        run: pnpm lint:colors

      # Gates three classes that typecheck can't see, because every one of them
      # is a valid string: a locale missing keys the others have, user-visible
      # English hardcoded into JSX, and a t() key that resolves to nothing (which
      # renders the key itself on screen). octarq-pro isn't checked out here, so
      # the audit's Pro half is skipped — it runs locally where both repos sit
      # side by side.
      - name: i18n audit
        run: pnpm i18n:audit

      - name: Test dashboard
        run: pnpm test

      # plugin-sdk is a member of the web workspace (../packages/*), so its
      # deps are already installed by the pnpm install above.
      - name: Test plugin SDK
        run: pnpm --filter @octarq/plugin-sdk test

      - name: Build dashboard
        run: pnpm build

  # Self-sufficient: web/tests/e2e-server.mjs rebuilds the dashboard and the Go
  # binary, so this does not wait on the go/web jobs. Running in parallel with
  # them is what makes a frontend PR's wall clock ~web+e2e instead of go+e2e.
  e2e:
    name: End-to-end (Playwright)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # Run inside the official Playwright image, which ships the browsers and the
    # system libraries they need. The job previously called
    # `playwright install --with-deps` on a bare runner, so every run did an
    # apt-get against archive.ubuntu.com. On 2026-08-19 that fetch stalled after
    # five Get: lines and the job sat for 2h13m before being cancelled, without
    # having started a single test — a network dependency on the critical path
    # of every PR, buying nothing that the image does not already provide.
    #
    # Keep this tag in sync with @playwright/test in web/package.json. Playwright
    # refuses to launch when the client and the bundled browsers disagree, and
    # the failure names a missing executable rather than a version mismatch.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4 # keep in sync with web/package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: pnpm install --no-frozen-lockfile
        working-directory: web

      # `pnpm e2e` is self-sufficient from a clean checkout: the webServer
      # bootstrap (web/tests/e2e-server.mjs) rebuilds the dashboard and the Go
      # binary itself, so no hand-started server or manual prebuild is needed.
      # The committed webembed/dist is stale on any branch that touches web/,
      # which is why the harness always rebuilds it rather than trusting dist.
      - name: Run e2e
        run: pnpm e2e
        working-directory: web

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # webembed/dist must stay committed: octarq-pro consumes octarq as a Go module
  # and gets the embedded dashboard from the module zip. CI keeps it fresh so
  # nobody has to build and commit dist locally.
  #
  # This used to run on the PR branch, committing a fresh dist onto the head of
  # every PR that touched web/. That bot-authored push became the new head, and
  # GitHub gates workflow runs on bot pushes: the run stopped at
  # `action_required` and the PR read as unchecked until a human approved it.
  # Every frontend PR needed that click, on a commit nobody reviews anyway.
  #
  # So the refresh moved behind the merge. On a push to main, this rebuilds the
  # dashboard and — only if the output actually differs — opens a PR with just
  # webembed/dist. Merging that PR is the one manual step, and it replaces a
  # manual approval that had to happen on every frontend PR.
  #
  # The dist PR itself carries no checks: PRs opened with GITHUB_TOKEN don't
  # trigger workflows. That is the same restriction as before, but harmless
  # here — the source it was built from already passed CI on this very commit.
  #
  # needs: [web] so a go-only main push (web skipped) does not rebuild dist.
  dist:
    name: Refresh embedded dashboard
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.web.result == 'success'
    needs: [web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # Why this guard exists — it is what produced the empty PR #200.
      #
      # This job checks out `github.sha`, but the PR it opens targets `main` as
      # main is *now*. Those are the same commit only if no merge landed while
      # the job waited on `needs`. On 2026-08-06 three PRs merged inside four
      # minutes: a web change (#196) queued its dist PR, that dist PR merged,
      # and only then did the *older* #197 push finally reach this job. It
      # rebuilt the dashboard from #197's tree, correctly saw 44 changed files
      # against its own checkout — and opened a PR carrying a dist that main
      # had already merged one commit earlier. Zero files, zero commits.
      #
      # Note what it was NOT: the build is deterministic. The two runs after it
      # rebuilt the same sources and got byte-identical output, which is the
      # only reason the diff stayed at exactly the 44 files #196 accounted for.
      #
      # A stale run has nothing useful to contribute anyway: the newer commit's
      # own run builds from a tree that already contains ours, so skipping here
      # loses nothing. If that newer run is red (`needs` gates it), dist simply
      # stays stale until the next green push to main rebuilds it — the refresh
      # is always driven off the newest green tip, so nothing is lost for good.
      - name: Skip if a newer commit already landed on main
        id: tip
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          echo "main is at $tip; this run is for $GITHUB_SHA"
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "A newer commit owns the dist refresh — skipping."
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4 # keep in sync with web/package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - if: steps.tip.outputs.current == 'true'
        run: pnpm install --no-frozen-lockfile
        working-directory: web

      - if: steps.tip.outputs.current == 'true'
        run: pnpm build
        working-directory: web

      # The build takes minutes; main can move during it. Re-check at the last
      # possible moment so the decision is made against the base the PR will
      # actually target, not against a tip that was current when we started.
      - name: Re-check the tip after building
        id: tip_after_build
        if: steps.tip.outputs.current == 'true'
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "main moved to $tip during the build — skipping."
          fi

      - name: Open a PR if dist changed
        if: steps.tip_after_build.outputs.current == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT_GITHUB || secrets.GITHUB_TOKEN }}
          add-paths: webembed/dist
          branch: chore/refresh-embedded-dashboard
          # Tidy up the reused branch once main has the dist — otherwise it
          # outlives every merge and sits there looking like pending work. Only
          # fires when the branch no longer differs from base, so it can never
          # discard a refresh that still needs merging. This is a backstop for
          # the seconds-wide window the re-check above can't close, not the fix.
          delete-branch: true
          # Reuse one branch: a second merge before the first dist PR lands
          # updates that PR rather than opening a competing one.
          commit-message: "chore(web): refresh embedded dashboard build [auto]"
          title: "chore(web): refresh embedded dashboard build"
          body: |
            The dashboard bundle in `webembed/dist` no longer matches `web/`.

            octarq-pro consumes octarq as a Go module and gets the embedded
            dashboard from the module zip, so dist has to stay committed and
            current. This was built from ${{ github.sha }}, which already
            passed CI.

            Nothing here is hand-written — merge it as-is, or close it if a
            newer merge is about to supersede it.

  # Aggregator for branch protection: the rule requires a single check named
  # "CI". Without this, a website-only change skips go/web/e2e and GitHub
  # never reports a "CI" conclusion, leaving the PR at "Expected — Waiting".
  # This job always runs and maps skipped → success, failure/cancelled → failure.
  CI:
    name: CI
    if: always()
    needs: [changes, go, web, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs
        run: |
          for result in "${{ needs.changes.result }}" "${{ needs.go.result }}" "${{ needs.web.result }}" "${{ needs.e2e.result }}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "Required job failed: $result"
              exit 1
            fi
          done
          echo "CI passed (success or skipped)"
