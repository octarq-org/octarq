# GoReleaser — binaries + GitHub release.
#
# Design notes:
# - linux/{amd64,arm64} only. The cross-compile is native-speed (no QEMU).
# - Release notes are NOT generated here: CI pre-renders them with git-cliff
#   (same cliff.toml, same `--latest --strip header` flags as before) and
#   passes the file via `goreleaser release --release-notes=...`, keeping the
#   published format byte-identical to the previous softprops-based flow.
# - No container image. A useful Octarq build carries the plugins the operator
#   chose, so a shared image cannot be the one they run. `docker compose up
#   -d --build` builds from the operator's own tree instead.
version: 2

project_name: octarq

builds:
  - id: octarq
    dir: server
    main: .
    binary: octarq
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      # Same injection set as the Makefile's LDFLAGS / old Dockerfile build.
      - -X github.com/octarq-org/octarq/server/internal/buildinfo.Version={{ .Version }}
      - -X github.com/octarq-org/octarq/server/internal/buildinfo.Commit={{ .ShortCommit }}
      - -X github.com/octarq-org/octarq/server/internal/buildinfo.BuiltAt={{ .Date }}

# Upload raw binaries instead of archives, named like the assets this project
# already publishes elsewhere: octarq-linux-amd64 / octarq-linux-arm64.
archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  prerelease: auto
